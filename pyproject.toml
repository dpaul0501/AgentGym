[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgym"
version = "0.1.0.dev0"
description = "Diagnose which layer of an LLM agent is broken, route the fix to a real optimizer, and prove the improvement — a protocol, not an app."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Debjyoti Paul" }]
keywords = ["llm", "agents", "reinforcement-learning", "evaluation", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# each real integration is opt-in — installing agentgym core never pulls in every
# third-party tool it can bind a scope to
dspy = ["dspy>=3.2"]
langgraph = ["langgraph>=0.2", "optuna>=3.6"]
finetune = ["unsloth", "trl>=0.12", "peft>=0.13"]
inspect = ["inspect-ai"]
providers = ["boto3>=1.34"]
# headroom-ai is real and pip-installable. wilpel/caveman-compression is NOT pip-installable
# (no setup.py/pyproject.toml upstream, no LICENSE file) — CavemanMemoryOptimizer imports it via
# sys.path from a local clone the caller provides, deliberately not vendored into this repo.
memory = ["headroom-ai>=0.33", "optuna>=3.6"]
# nltk<3.10 is pinned deliberately: invariant-ai's `testing` submodule transitively imports nltk,
# and nltk>=3.10's CWE-427 CWD-import guard raises under uv's editable-install sys.path entry
# when the project root equals the process cwd (confirmed directly against this repo's venv).
security = ["garak>=0.15", "invariant-ai>=0.2", "nltk<3.10", "transformers", "torch"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["agentgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: real calls to external tools/services (LLMs, cloud GPUs) — not part of the fast unit suite, run explicitly with `-m integration`",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
