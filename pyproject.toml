[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgym"
version = "0.1.0.dev0"
description = "Diagnose which layer of an LLM agent is broken, route the fix to a real optimizer, and prove the improvement — a protocol, not an app."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Debjyoti Paul" }]
keywords = ["llm", "agents", "reinforcement-learning", "evaluation", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# each real integration is opt-in — installing agentgym core never pulls in every
# third-party tool it can bind a scope to
dspy = ["dspy>=3.2"]
langgraph = ["langgraph>=0.2", "optuna>=3.6"]
finetune = ["unsloth", "trl>=0.12", "peft>=0.13"]
inspect = ["inspect-ai"]
providers = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["agentgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
